services:
  - type: web
    name: brandinabox-fbads
    runtime: static
    buildCommand: echo "static site"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /robots.txt
        name: Content-Type
        value: text/plain
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml
      - path: /llms.txt
        name: Content-Type
        value: text/plain
